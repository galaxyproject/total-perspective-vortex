global:
  default_inherits: default

tools:
  default:
    abstract: true
    cores: 2
    mem: 4

roles:
  # The undefined name lives on a role, not a tool: lint must type-check role rules too.
  training:
    rules:
      - id: undefined_in_role
        if: training_quota_exceeded
        cores: 1

destinations:
  local:
    runner: local
    max_accepted_cores: 4
    max_accepted_mem: 16
