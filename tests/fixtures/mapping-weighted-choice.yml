global:
  default_inherits: default
  context:
    jwd_pool:
      - value: /fast/jobs
        weight: 3
      - value: /slow/jobs
        weight: 1

tools:
  default:
    cores: 2
    mem: cores * 3
    params:
      job_working_directory: "{helpers.weighted_choice(jwd_pool)}"
    scheduling:
      require: []
      prefer:
        - general
      accept:
      reject: []

  bwa:
    cores: 4
    mem: cores * 4

destinations:
  local:
    runner: local
    max_accepted_cores: 16
    max_accepted_mem: 64
    scheduling:
      prefer:
        - general
